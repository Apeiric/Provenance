[project]
name = "provenance"
version = "0.1.0"
description = "Deterministic grounding check for agent decisions"
entry-point = "main.jac"
# Stays "cli" on purpose. `jac start main.jac` serves the web app explicitly,
# and keeping the kind as cli means a bare `jac run main.jac` still runs the
# terminal path -- the fallback demo if the frontend has to be cut.
kind = "cli"

[dependencies]
byllm = "~=0.6"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "4.7.0"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[client]

[byllm.model]
default_model = "anthropic/claude-sonnet-5"
